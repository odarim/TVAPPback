name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          # In APP_ENV=test, doctrine.yaml appends a "_test" dbname_suffix, so the
          # base DB "app" is accessed as "app_test". Create that DB here.
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_DEBUG: "0"
      APP_SECRET: ci_test_secret
      # Base dbname is "app"; the test env's "_test" suffix resolves it to the
      # "app_test" database created by the postgres service above.
      DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8"
      JWT_PASSPHRASE: ci_test_passphrase
      PAPI_API_KEY: ci_test_key

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, iconv, pdo_pgsql, intl, opcache, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json / composer.lock
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate JWT keys
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction

      - name: Lint PHP syntax
        run: find src migrations public config -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Lint YAML config
        run: php bin/console lint:yaml config --no-debug

      - name: Lint Twig templates
        run: php bin/console lint:twig templates --no-debug

      - name: Lint service container
        run: php bin/console lint:container --no-debug

      - name: Validate Doctrine mapping
        run: php bin/console doctrine:schema:validate --skip-sync --no-interaction || true

      - name: Run migrations (smoke test)
        run: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Run tests
        run: |
          if [ -d tests ] && [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "No test suite present — skipping."
          fi

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: tvapp-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    # Only deploy real pushes to main, never PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing repository secret RENDER_DEPLOY_HOOK_URL."
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "Get the URL from Render: Service > Settings > Deploy Hook."
            exit 1
          fi
          echo "Triggering Render deploy..."
          curl -fsSL "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy triggered."
