; Production PHP settings for the StreamPulse (TVAPP) backend.

expose_php = Off
memory_limit = 256M
date.timezone = UTC

; Reasonable upload limits for logo / asset uploads.
upload_max_filesize = 16M
post_max_size = 16M

; OPcache tuned for a long-running FrankenPHP process.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code never changes inside an immutable image, so skip timestamp checks.
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
